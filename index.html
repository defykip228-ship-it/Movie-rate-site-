<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кіно та Серіали</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-controls">
            <button id="loginBtn" class="filter-btn action-btn" style="background-color: #e50914; border-color: #e50914;">Увійти</button>
            <button id="logoutBtn" class="filter-btn action-btn" style="display: none; background-color: #555; border-color: #555;">Вийти</button>
            <button id="favoritesBtn" class="filter-btn action-btn" style="display: none; background-color: #e50914; border-color: #e50914;">❤️ Мої фільми</button>
            <button id="themeToggle" class="filter-btn action-btn">☀️ Світла тема</button>
            <select id="contentType" class="filter-select light-style">
                <option value="movie">🎬 Фільми</option>
                <option value="tv">📺 Серіали</option>
            </select>

            <button id="homeBtn" class="filter-btn">Головна</button>
            <button id="randomBtn" class="filter-btn action-btn" style="background-color: #ffc107; color: #000; border-color: #ffc107;">🎲 Випадковий</button>
            
            <select id="sort" class="filter-select light-style">
                <option value="popularity.desc">По порядку</option>
                <option value="vote_average.desc">Найвищий рейтинг</option>
                <option value="vote_count.desc">Обговорюване</option>
                <option value="first_air_date.desc" id="sortDate">Нещодавно додано</option>
            </select>
            
            <select id="genre" class="filter-select light-style">
                <option value="">Усі жанри</option>
                <option value="28">Бойовик / Екшн</option>
                <option value="12">Пригоди</option>
                <option value="16">Мультфільм</option>
                <option value="35">Комедія</option>
                <option value="80">Кримінал</option>
                <option value="18">Драма</option>
                <option value="10751">Сімейний</option>
                <option value="14">Фентезі</option>
                <option value="27">Жахи</option>
                <option value="878">Фантастика</option>
                <option value="53">Трилер</option>
            </select>

            <select id="rating" class="filter-select light-style">
                <option value="">Будь-яка оцінка</option>
                <option value="8">Більше 8</option>
                <option value="7">Більше 7</option>
                <option value="6">Більше 6</option>
            </select>

            <button id="applyFilters" class="filter-btn action-btn">Фільтрувати</button>
        </div>

        <form id="form" class="search-form">
            <select id="searchType" class="filter-select light-style" style="border-radius: 50px 0 0 50px; border-right: none;">
                <option value="title">За назвою</option>
                <option value="actor">За актором</option>
            </select>
            <input type="text" id="search" placeholder="Пошук..." class="search light-style" style="border-radius: 0 50px 50px 0;">  
        </form>
    </header>
    
    <main id="main"></main>

    <div id="loading-sentinel" style="width: 100%; height: 50px; display: flex; justify-content: center; align-items: center; margin-top: 20px;"></div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h2 id="modalTitle">Назва</h2>
            <p id="modalCast"><strong>Актори:</strong> Завантаження...</p>
            <div id="trailerContainer" class="trailer-container"></div>
            
            <div id="similarMoviesSection" style="margin-top: 30px; display: none;">
                <h3 style="border-bottom: 1px solid #ccc; padding-bottom: 10px;">Схожі рекомендації:</h3>
                <div id="similarMoviesContainer" class="similar-movies-container"></div>
            </div>
        </div>
    </div>

    <div id="authModal" class="modal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <span class="close-btn" id="closeAuthModal">&times;</span>
            <h2 id="authTitle">Вхід</h2>
            <form id="authForm" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
                <input type="email" id="authEmail" placeholder="Email" required class="search light-style" style="width: 100%;">
                <input type="password" id="authPassword" placeholder="Пароль (мінімум 6 символів)" required class="search light-style" style="width: 100%;">
                <button type="submit" id="authSubmitBtn" class="details-btn">Увійти</button>
            </form>
            <p style="margin-top: 15px; font-size: 0.9rem;">
                <span id="authToggleText">Немає акаунту?</span> 
                <a href="#" id="authToggleLink" style="color: #0d6efd; text-decoration: none; font-weight: bold;">Зареєструватися</a>
            </p>
        </div>
    </div>
</body>
</html>
